/* ========== 原型需求浏览器外壳 ========== */

#top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px 0 16px;background:#fff;border-bottom:1px solid var(--v-line);min-width:0;z-index:5}

.vbtn{height:30px;padding:0 10px;border:1px solid var(--v-line);background:#fff;border-radius:6px;font:13px/1 inherit;font-family:inherit;color:var(--v-ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vbtn:hover{border-color:#c5cad1;color:var(--v-ink)}
.vbtn.on{border-color:var(--v-acc);color:var(--v-acc);background:var(--v-accw)}
.vbtn.chg.on{border-color:var(--v-chg);color:var(--v-chg);background:var(--v-chgw)}
kbd{font:11px/1 ui-monospace,Menlo,monospace;border:1px solid var(--v-line);border-bottom-width:2px;border-radius:3px;padding:2px 4px;color:var(--v-ink3);background:#fff}
.vbtn.on kbd{border-color:#b9c8f5;color:var(--v-acc)}
.role-sel{height:30px;padding:0 8px;border:1px solid var(--v-line);background:#fff;border-radius:6px;font:13px/1 inherit;font-family:inherit;color:var(--v-ink2);cursor:pointer;max-width:140px}
.role-sel:hover{border-color:#c5cad1;color:var(--v-ink)}
.audit-badge{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--v-line);color:var(--v-ink2);cursor:pointer;white-space:nowrap;text-decoration:none}
.audit-badge.ok{border-color:#bfe3cf;color:var(--v-ok);background:var(--v-okw)}
.audit-badge.bad{border-color:#f3c3be;color:var(--v-err);background:var(--v-errw)}

#left,#right{background:#fff;overflow:auto;min-width:0;min-height:0}
#left{grid-column:1;grid-row:2;border-right:1px solid var(--v-line)}
#stagewrap{grid-column:2;grid-row:2}

/* 左侧目录 */

.nv-i .vm{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}
.vm.add{background:var(--v-ok)}.vm.mod{background:#7048e8}.vm.del{background:var(--v-err)}
.nv-head{padding:14px 16px 8px;font-size:12px;color:var(--v-ink3);line-height:1.6;border-bottom:1px solid var(--v-line)}

.fl-h{padding:12px 16px;cursor:pointer;display:block;text-decoration:none}
.fl-h:hover{background:#f7f8fa}
.fl-h b{display:block;font-size:13.5px}
.fl-h span{display:block;font-size:12px;color:var(--v-ink3);margin-top:2px}
.fl.on .fl-h{background:var(--v-accw)}
.fl.on .fl-h b{color:var(--v-acc)}
.fl-s{padding:4px 0 10px}
.fl-s a{display:flex;gap:8px;padding:5px 16px 5px 20px;font-size:12.5px;text-decoration:none;color:var(--v-ink2);line-height:1.5;cursor:pointer}
.fl-s a i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid var(--v-line);display:grid;place-items:center;font-size:11px;flex:none;color:var(--v-ink3);background:#fff}
.fl-s a.on{color:var(--v-ink);font-weight:600}
.fl-s a.on i{background:var(--v-acc);border-color:var(--v-acc);color:#fff}

/* 中间舞台 */
#stagewrap{position:relative;min-width:0;min-height:0}

#devwrap{position:relative;flex:none}
.dev{transform-origin:0 0;position:absolute;left:0;top:0}
.dev-pc{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.08);overflow:hidden;border:1px solid #d3d7dd}
.dev-bar{height:32px;background:#f1f2f4;border-bottom:1px solid #dfe2e6;display:flex;align-items:center;gap:6px;padding:0 12px}
.dev-bar i{width:10px;height:10px;border-radius:50%;background:#d0d4da}
.dev-bar .url{margin-left:14px;height:20px;line-height:20px;padding:0 10px;border-radius:4px;background:#fff;font-size:12px;color:var(--v-ink3);min-width:380px}
.dev-m{padding:11px;background:#2b2f36;border-radius:54px;box-shadow:0 12px 36px rgba(0,0,0,.18)}
.dev-m .scr{border-radius:43px;overflow:hidden;background:#fff}
.scr{position:relative;overflow:hidden}
.scr>.ab,.scr>iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.cap{margin-top:12px;font-size:12.5px;color:var(--v-ink3);text-align:center;max-width:900px;line-height:1.6}
.cap b{color:var(--v-ink2);font-weight:600}
.cap .demo{display:inline-block;margin-left:6px;padding:0 6px;border-radius:3px;background:#fff;border:1px solid var(--v-line);font-size:11.5px}
.cap .unk{color:var(--v-amb);font-weight:600}
body.flow-on #stage-in{padding-bottom:96px}

/* 标注圆点 */
#dots{position:absolute;inset:0;pointer-events:none;z-index:2147483000}
body.no-dots #dots{display:none}
.fdot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--v-acc);color:#fff;font:600 11px/20px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto;user-select:none;transition:transform .12s}
.fdot:hover,.fdot.on{transform:scale(1.25)}
.fdot.on{box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(47,91,234,.35)}
.fdot.st-pending,.fdot.st-assumed{background:#c77700}
.fdot.st-assumed{background:#fff;color:#c77700;box-shadow:0 0 0 2px #c77700,0 2px 6px rgba(0,0,0,.2)}
.fdot.v-add{background:var(--v-ok);color:#fff;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
.fdot.v-mod{background:#7048e8;color:#fff;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
.xbox{position:absolute;border:1.5px dashed rgba(196,50,42,.85);border-radius:3px;background:rgba(196,50,42,.05);pointer-events:auto;cursor:help}
.xbox.sm i{right:-6px;top:-6px;width:13px;height:13px;padding:0;border-radius:50%;font-size:9px;line-height:13px;text-align:center}
.xbox i{position:absolute;right:0;top:0;transform-origin:100% 0;font:600 10.5px/15px -apple-system,BlinkMacSystemFont,sans-serif;font-style:normal;padding:0 5px;border-radius:0 0 0 4px;background:rgba(196,50,42,.9);color:#fff;white-space:nowrap}
.fbox{position:absolute;border:2px solid var(--v-acc);border-radius:4px;background:rgba(47,91,234,.06);pointer-events:none}

/* 流程条 */
#flowbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,calc(100% - 32px));background:#1d2129;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:6}
body.flow-on #flowbar{display:flex}
#flowbar .fb-t{font-size:12px;color:#aab0b9;white-space:nowrap}
#flowbar .fb-n{font-size:13.5px;line-height:1.5;flex:1;min-width:0}

#flowbar button{height:32px;padding:0 12px;border-radius:7px;border:1px solid #3d434c;background:#2a2f37;color:#fff;font:13px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
#flowbar button.p{background:#fff;color:#1d2129;border-color:#fff;font-weight:600}
#flowbar button[disabled]{opacity:.35;cursor:default}

/* 右侧需求面板 */
.np{padding:16px 18px 40px}
.np-id{font:12px ui-monospace,Menlo,monospace;color:var(--v-ink3);display:flex;gap:8px;align-items:center}
.np h2{font-size:17px;margin:2px 0 6px;line-height:1.4}
.np .goal{color:var(--v-ink2);font-size:13px;margin:0 0 4px;line-height:1.7}
.np .meta{font-size:12px;color:var(--v-ink3);line-height:1.7}
.np-sec{border-top:1px solid var(--v-line);padding:14px 0 10px;margin-top:12px}
.np-sec>h3{font-size:12px;color:var(--v-ink3);font-weight:500;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.np-sec>h3 .r{display:flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border:1px solid var(--v-line);border-radius:999px;color:var(--v-ink2);text-decoration:none;cursor:pointer;background:#fff;line-height:1.4}
.chip:hover{border-color:#b9bfc8;color:var(--v-ink)}
.chip.on{background:var(--v-ink);color:#fff;border-color:var(--v-ink)}
.chip.sm{font-size:11.5px;padding:1px 8px}
.when{margin-top:8px;font-size:12.5px;color:var(--v-ink2);background:#f6f7f9;border-radius:6px;padding:7px 10px;line-height:1.65}
.when b{color:var(--v-ink);font-weight:600}
.np ul{margin:0;padding-left:18px}
.np li{font-size:13px;color:var(--v-ink2);margin:4px 0;line-height:1.65}
.np li b,.np li strong{color:var(--v-ink);font-weight:600}
.np .lk{display:flex;flex-direction:column;gap:2px}
.np .lk a{display:flex;gap:8px;align-items:baseline;font-size:13px;text-decoration:none;padding:5px 8px;margin:0 -8px;border-radius:6px;color:var(--v-ink2);cursor:pointer}
.np .lk a:hover{background:#f5f6f8;color:var(--v-ink)}
.np .lk a code{font:12px ui-monospace,Menlo,monospace;color:var(--v-acc);flex:none}
.np .hintline{font-size:12px;color:var(--v-ink3);line-height:1.6;margin-top:6px}
.np .tolink{display:block;margin-top:18px;font-size:13px;color:var(--v-acc);text-decoration:none;cursor:pointer}
.mini-sw{font-size:11.5px;color:var(--v-ink3);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
.mini-sw i{width:24px;height:14px;border-radius:7px;background:#c9ced6;position:relative;display:inline-block}
.mini-sw i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
.mini-sw.on i{background:var(--v-acc)}.mini-sw.on i::after{left:12px}

/* 功能点卡片 */
.fc{border:1px solid var(--v-line);border-radius:10px;margin-top:8px;background:#fff;transition:border-color .15s,box-shadow .15s}
.fc.on{border-color:var(--v-acc);box-shadow:0 0 0 3px var(--v-accw)}
.fc.off{background:#fafbfc}

.fc-h{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;cursor:pointer}
.fc-h .n{width:20px;height:20px;border-radius:50%;background:var(--v-acc);color:#fff;font:600 11px/20px -apple-system,sans-serif;text-align:center;flex:none;margin-top:1px}
.fc.off .fc-h .n{background:#c9ced6}
.fc-h .n.st-pending{background:#c77700}
.fc-h .n.st-assumed{background:#fff;color:#c77700;box-shadow:inset 0 0 0 1.5px #c77700}
.fc-h .n.sh{background:#fff;color:var(--v-ink3);box-shadow:inset 0 0 0 1px var(--v-line)}
.fc-h b{font-size:13.5px;line-height:1.5;flex:1;min-width:0}
.fc-h .fid{font:11px ui-monospace,Menlo,monospace;color:var(--v-ink3);margin-left:4px;font-weight:400}
.fc-b{padding:0 12px 12px 40px;font-size:13px;color:var(--v-ink2);line-height:1.7}
.fc.fold .fc-b{display:none}
.fc-b p{margin:0 0 6px}
.fc-b ul,.fc-b ol{margin:2px 0 6px;padding-left:18px}
.fc-b li{margin:2px 0;font-size:13px}
.fc-b .k{font-size:11.5px;color:var(--v-ink3);margin:10px 0 4px;font-weight:500;letter-spacing:.02em}
.fc-b .fd{border-top:1px dashed var(--v-line);padding:5px 0;font-size:12.5px;line-height:1.6}
.fc-b .fd:first-of-type{border-top:0}
.fc-b .fd b{color:var(--v-ink);font-weight:600}
.fc-b .fd .ty{color:var(--v-ink3);margin:0 4px}

.fc-b .vis{font-size:11.5px;color:var(--v-ink3);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fc-b code,.doc code,.np code{font:12px ui-monospace,Menlo,monospace;background:#f3f4f6;border-radius:4px;padding:1px 4px;color:var(--v-ink2)}
.fc-b table{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0}
.fc-b th,.fc-b td{border:1px solid var(--v-line);padding:4px 6px;text-align:left;vertical-align:top}

/* 状态与版本徽标 */
.bdg{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border-radius:3px;margin:0 2px;vertical-align:1px;font-weight:500;white-space:nowrap;font-style:normal}
.bdg.pending{background:var(--v-ambw);color:var(--v-amb)}
.bdg.assumed{background:#fff;color:var(--v-amb);box-shadow:inset 0 0 0 1px #e8c48f}
.bdg.add{background:var(--v-okw);color:var(--v-ok)}
.bdg.mod{background:#f0ebff;color:#5f3dc4}
.bdg.del{background:var(--v-errw);color:var(--v-err)}
.bdg.ui{background:#f0f2f5;color:var(--v-ink2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--v-ink3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--v-acc)}
.legend i.p{background:#c77700}.legend i.a{background:#fff;box-shadow:inset 0 0 0 1.5px #c77700}
.legend i.add{background:var(--v-ok)}.legend i.mod{background:#7048e8}

/* 需求文档 */
.doc{width:min(1080px,100%);background:#fff;border:1px solid #d9dde3;border-radius:12px;padding:36px 52px 64px;margin-bottom:24px;position:relative}
.doc-bar{position:sticky;top:-20px;z-index:3;display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-36px -52px 18px;padding:12px 18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--v-line);border-radius:12px 12px 0 0;backdrop-filter:blur(4px)}
.doc-bar .l{margin-right:auto;font-size:12px;color:var(--v-ink3)}
.doc h1{font-size:26px;margin:8px 0 10px;line-height:1.35}
.doc h2{font-size:20px;margin:44px 0 10px;padding-top:28px;border-top:1px solid var(--v-line);line-height:1.4}

.doc p{margin:6px 0}
.doc ul,.doc ol{padding-left:22px;margin:6px 0}

.doc blockquote p{margin:2px 0}
.doc a{color:var(--v-acc);text-decoration:none}
.doc a:hover{text-decoration:underline}
.doc table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13px}
.doc th,.doc td{border:1px solid var(--v-line);padding:7px 10px;text-align:left;vertical-align:top;line-height:1.65}
.doc th{background:#f6f7f9;font-weight:500;color:var(--v-ink2);font-size:12.5px;white-space:nowrap}
.doc td code{white-space:nowrap}
.doc hr{border:0;border-top:1px solid var(--v-line);margin:24px 0}
.doc img{max-width:100%}
.doc pre{background:#f6f7f9;border-radius:8px;padding:12px 14px;overflow:auto;font-size:12.5px}

.doc .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0 6px}
.doc .stats>div{border:1px solid var(--v-line);border-radius:10px;padding:10px 14px}
.doc .stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.doc .stats span{font-size:12px;color:var(--v-ink3)}
.doc .flowgo{display:inline-block;margin-top:4px;font-size:13px}
.doc-empty{color:var(--v-ink3);font-size:13px}

/* 文档模式右侧摘要 */
.sum-k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-k>div{border:1px solid var(--v-line);border-radius:8px;padding:8px 10px}
.sum-k b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.sum-k span{font-size:11.5px;color:var(--v-ink3)}
.pend-l a{display:block;font-size:12.5px;color:var(--v-ink2);text-decoration:none;padding:5px 0;border-top:1px dashed var(--v-line);line-height:1.55;cursor:pointer}

  --dialog-h-max: 640px;    /* 超出后中间内容区滚动，头和脚固定 */
  --dialog-head-h: 56px;
  --dialog-body-min-h: 60px;
  --dialog-info-w: 352px;   /* [待确认] 信息提醒类，只见于图示（C17） */
  --dialog-radius: var(--radius-lg);
  --mask-bg: rgb(26 34 51 / 64%);  /* 遮罩，LV1 #1A2233 64% */

  /* ── 间距 [AI 归纳] ───────────────────────────────────────────────── */
  /* 规范没有间距章节。正文反复出现 4/8/12/16/24/32/40/48，且要求间距取 8 的倍数。 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;

  /* ── 布局与导航 [3.2、4.5] ───────────────────────────────────────── */
  --canvas-w: 1440px;       /* [规范] 设计稿画板，1920/1440/1366 主流，1280 少数 */
  --canvas-h: 900px;
  --container-w: 1200px;    /* [规范] 仅用于上中下布局，原文示例值 [3.2]。展示类顶部侧边布局居中，宽度原文未给；侧边布局自适应 */
  --nav-primary: 64px;      /* [规范] 常规顶部导航一级 */
  --nav-secondary: 40px;    /* [规范] 常规顶部导航二级（与 48+8n 公式冲突，C9） */
  --nav-primary-display: 80px;   /* [规范] 展示类页面一级 */
  --nav-secondary-display: 48px; /* [规范] 展示类页面二级 */
  --nav-base: 48px;         /* [规范] 顶部导航公式：48 + 8n */
  --nav-step: 8px;
  --sidebar-base: 200px;    /* [规范] 侧边导航宽度公式：200 + 8n */
  --sidebar-step: 8px;

  /* ── 表格与下拉 [5.8、6.5] ───────────────────────────────────────── */
  --row-h: 54px;            /* [规范] 默认单元格高度 */
  --row-h-compact: 40px;    /* [规范] 仅用于对话框内 */
  --rows-per-page: 10;      /* [规范] 默认一页 10 行；不足 10 行隐藏页码；带输入操作的表格用滚动，不分页 [6.5] */
  --popup-max-h: 320px;     /* [规范] 下拉弹窗最大高度，超出内部滚动 */

  /* ── 标签 [6.4] ───────────────────────────────────────────────────── */
  --tag-font: 10px;         /* [规范] 常规体；20px 高的标签为 12px */
  --tag-h-sm: 14px;
  --tag-h-md: 16px;
  --tag-h-lg: 18px;
  --tag-h-xl: 20px;
}

/* ─────────────────────────────────────────────────────────────────────────
 * gaodeng-pc · theme.css（组件覆盖，只作用于 .ab[data-device="pc"] 画板）
 *
 * 1. 把 wire.css 的设计变量（--ink、--acc、--line 等）指向 tokens.css 的规范变量；
 * 2. 按规范调整组件的尺寸和形态。页面代码不用改，只调用 h.* 组件。
 * 作用域为 .ab[data-device="pc"]：手机画板（data-device="mobile"）不套用本包。
 *
 * 合并方式：new.mjs --theme gaodeng-pc 时，tokens.css 与本文件合并为 prd/theme.css，
 * 构建时内联进交付 HTML。本文件依赖 tokens.css 中的变量名。
 * 标注见 DESIGN.md、冲突与待确认见 CONFLICTS.md（C 编号）。
 * ───────────────────────────────────────────────────────────────────────── */

/* ── 1. 设计变量（wire.css 的变量名不变） ─────────────────────────────── */
.ab[data-device="pc"] {
  --ink: var(--fg);
  --ink2: var(--fg-2);
  --ink3: var(--fg-3-ink);       /* 小字灰，见 DESIGN §11（C20） */
  --line: var(--border);
  --line2: var(--surface);
  --fill: var(--surface);
  --fill2: var(--surface);
  --pg: var(--bg);
  --acc: var(--accent);
  --accw: var(--accent-weak);
  --ok: var(--success-ink);
  --okw: var(--success-weak);
  --warn: var(--warn-ink);
  --warnw: var(--warn-weak);
  --err: var(--danger-ink);
  --errw: var(--danger-weak);
  --r: var(--radius-sm);
  --r-lg: var(--radius-lg);
  --font: var(--font-family);
  font: var(--text-sm) / var(--lh-sm) var(--font);
  color: var(--fg);
  background: var(--bg);
}

/* ── 2. 文字 [1.2]：标题用 Medium，字号按规范字阶 ───────────────────── */
.ab[data-device="pc"] h1 { font-size: var(--text-2xl); line-height: var(--lh-2xl); font-weight: var(--fw-medium); }
.ab[data-device="pc"] h2 { font-size: var(--text-md); line-height: var(--lh-md); font-weight: var(--fw-medium); }
.ab[data-device="pc"] h3 { font-size: var(--text-base); line-height: var(--lh-base); font-weight: var(--fw-medium); }
.ab[data-device="pc"] h4 { font-size: var(--text-sm); line-height: var(--lh-sm); font-weight: var(--fw-medium); }
.ab[data-device="pc"] .b, .ab[data-device="pc"] .big { font-weight: var(--fw-medium); }  /* 规范里的“加粗”按 Medium 理解（C19） */
.ab[data-device="pc"] .sm { font-size: var(--text-xs); }
.ab[data-device="pc"] .md { font-size: var(--text-sm); }
.ab[data-device="pc"] .lg { font-size: var(--text-base); }
.ab[data-device="pc"] .xl { font-size: var(--text-md); }

/* ── 3. 按钮 [2.2]：页面中 40、弹窗与表格内 32、辅助操作 24 ─────────── */
.ab[data-device="pc"] .btn {
  height: var(--h-lg);
  min-width: var(--btn-min-w);
  padding: 0 16px;
  gap: 8px;
  font-size: var(--text-base);
  line-height: 1;
  border-radius: var(--r);
  border: 1px solid var(--accent);
  background: var(--bg);
  color: var(--accent);
}
.ab[data-device="pc"] .btn svg { width: var(--icon-size); height: var(--icon-size); }
.ab[data-device="pc"] .btn:has(> svg) { min-width: var(--btn-min-w-icon); }
.ab[data-device="pc"] .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.ab[data-device="pc"] .btn.txt { height: auto; min-width: 0; padding: 0 4px; border-color: transparent; background: transparent; color: var(--accent); }
.ab[data-device="pc"] .btn.red { color: var(--danger-ink); border-color: var(--danger-ink); }
.ab[data-device="pc"] .btn.pri.red { background: var(--danger-fill); border-color: var(--danger-fill); color: var(--accent-on); }
.ab[data-device="pc"] .btn.blk { width: 100%; }
.ab[data-device="pc"] .btn.lg { height: var(--h-lg); font-size: var(--text-base); }
.ab[data-device="pc"] .btn.sm {
  height: var(--h-md);
  min-width: var(--btn-min-w-md);
  padding: 0 12px;
  font-size: var(--text-sm);
  border-radius: var(--r);
}
.ab[data-device="pc"] .btn.sm:has(> svg) { min-width: var(--btn-min-w-icon-md); }    /* 32px 含图标最小宽，原文仅一处（C18） */
.ab[data-device="pc"] .btn.sm svg { width: var(--icon-size-md); height: var(--icon-size-md); }
.ab[data-device="pc"] .btn.xs {
  height: var(--h-sm);
  min-width: var(--btn-min-w-sm);
  padding: 0 8px;
  font-size: var(--text-sm);
  border-radius: var(--r);
}
.ab[data-device="pc"] .btn.xs svg { width: var(--icon-size-sm); height: var(--icon-size-sm); }
.ab[data-device="pc"] .dlg .btn:not(.xs), .ab[data-device="pc"] .tbl .btn:not(.xs) {
  height: var(--h-md);
  min-width: var(--btn-min-w-md);
  padding: 0 12px;
  font-size: var(--text-sm);
  border-radius: var(--r);
}
.ab[data-device="pc"] .btn[disabled] { opacity: 1; cursor: not-allowed; border-color: var(--accent-disabled); color: var(--accent-disabled); background: var(--bg); }
.ab[data-device="pc"] .btn.pri[disabled] { background: var(--accent-disabled); border-color: var(--accent-disabled); color: var(--accent-on); }
.ab[data-device="pc"] .btn.txt[disabled] { background: transparent; border-color: transparent; }

/* ── 4. 标签 [6.4]：圆角 2px；20px 高的标签字号 12px ─────────────────── */
.ab[data-device="pc"] .tag {
  height: var(--tag-h-xl);
  padding: 0 6px;
  font-size: var(--text-xs);
  font-weight: 400;
  line-height: 1;
  border: 0;
  border-radius: var(--radius-tag);
}
.ab[data-device="pc"] .t-gray { background: var(--surface); color: var(--fg-2); }
.ab[data-device="pc"] .t-acc, .ab[data-device="pc"] .t-sys { background: var(--accent-weak); color: var(--accent); }
.ab[data-device="pc"] .t-pend { border: 1px dashed var(--muted); background: var(--bg); color: var(--fg-2); }
.ab[data-device="pc"] .t-ok { background: var(--success-weak); color: var(--success-ink); }
.ab[data-device="pc"] .t-warn { background: var(--warn-weak); color: var(--warn-ink); }
.ab[data-device="pc"] .t-err { background: var(--danger-weak); color: var(--danger-ink); }
.ab[data-device="pc"] .t-dark { background: var(--fg); color: var(--accent-on); }
.ab[data-device="pc"] .t-line { border: 1px solid var(--border); background: var(--bg); color: var(--fg-2); }

/* ── 5. 输入框 [5.6]：40 高（弹窗、表格内 32），内边距 12 ───────────── */
.ab[data-device="pc"] .inp {
  height: var(--h-lg);
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg);
  color: var(--fg);
  font-size: var(--text-sm);
}
.ab[data-device="pc"] .dlg .inp, .ab[data-device="pc"] .tbl .inp { height: var(--h-md); }
.ab[data-device="pc"] .inp.area { height: auto; padding: 8px 12px; }
.ab[data-device="pc"] .inp.bad { border-color: var(--danger-ink); }
.ab[data-device="pc"] input.inp:focus, .ab[data-device="pc"] select.inp:focus, .ab[data-device="pc"] textarea.inp:focus { border-color: var(--accent); }
.ab[data-device="pc"] input::placeholder, .ab[data-device="pc"] textarea::placeholder { color: var(--muted); }    /* 占位符是否豁免见 C24 */
.ab[data-device="pc"] .lbl { font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--fg-2); }
.ab[data-device="pc"] .lbl em { color: var(--danger-ink); }
.ab[data-device="pc"] .hint { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--fg-3-ink); }
.ab[data-device="pc"] .ferr { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--danger-ink); }

/* ── 6. 表格 [6.5]：单元格 54 高（对话框内 40），表头 LV6 底 ──────────── */
.ab[data-device="pc"] .tbl { font-size: var(--text-sm); }
.ab[data-device="pc"] .tbl th {
  height: var(--row-h);
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  color: var(--fg);
  font-size: var(--text-sm);
  font-weight: var(--fw-medium);
}
.ab[data-device="pc"] .tbl td {
  height: var(--row-h);
  padding: 0 12px;
  border-bottom: 1px solid var(--surface);
  color: var(--fg-2);
  font-size: var(--text-sm);
}
.ab[data-device="pc"] .tbl tr:not(:first-child):hover td { background: var(--accent-weak); }     /* 鼠标经过的高亮底 [1.1] */
.ab[data-device="pc"] .dlg .tbl th, .ab[data-device="pc"] .dlg .tbl td { height: var(--row-h-compact); }

/* ── 7. 分页 [6.5]：页码按钮 24 高；少于 10 行时隐藏页码、保留“共 N 条”（由 h.pager 决定，见 CONFLICTS C25） ── */
.ab[data-device="pc"] .pager {
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
  color: var(--fg-2);
  font-size: var(--text-sm);
  line-height: var(--lh-sm);
}
.ab[data-device="pc"] .pg-b, .ab[data-device="pc"] .pg-n {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--h-sm);
  height: var(--h-sm);
  padding: 0 4px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg);
  color: var(--fg-2);
  font-size: var(--text-sm);
}
.ab[data-device="pc"] .pg-n.on { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.ab[data-device="pc"] .pg-b.dis { border-color: var(--surface); color: var(--fg-disabled); }

/* ── 8. 页签、选中态：选中用品牌色 [4.3、6.6] ──────────────────────── */
.ab[data-device="pc"] .tabs > * { font-size: var(--text-sm); color: var(--fg-2); }
.ab[data-device="pc"] .tabs > .on { border-color: var(--accent); color: var(--accent); font-weight: var(--fw-medium); }
.ab[data-device="pc"] .opt.on { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: var(--fw-medium); }
.ab[data-device="pc"] .pill.on { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.ab[data-device="pc"] .ck.on::before { border-color: var(--accent); background-color: var(--accent); }
.ab[data-device="pc"] .sw.on { background: var(--accent); }
.ab[data-device="pc"] .step.on { color: var(--fg); font-weight: var(--fw-medium); }
.ab[data-device="pc"] .step.on b { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.ab[data-device="pc"] .step.ok b { border-color: var(--accent); color: var(--accent); }
.ab[data-device="pc"] .tl > .on { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.ab[data-device="pc"] .bar > i, .ab[data-device="pc"] .bar.acc > i { background: var(--accent); }
.ab[data-device="pc"] .nav a.on { border-color: var(--accent); color: var(--accent); font-weight: var(--fw-medium); }
.ab[data-device="pc"] .sidenav a.on { background: var(--accent-weak); color: var(--accent); font-weight: var(--fw-medium); }    /* AI 假设：规范未给侧边导航选中样式 */

/* ── 9. 卡片、提示条：圆角 8（卡片，C5）、卡片中阴影（C4） ──────────────── */
.ab[data-device="pc"] .card { border-color: var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
.ab[data-device="pc"] .box { border-color: var(--border); border-radius: var(--radius-sm); }
.ab[data-device="pc"] .bn-info { background: var(--accent-weak); color: var(--fg-2); }
.ab[data-device="pc"] .bn-warn { background: var(--warn-weak); color: var(--warn-ink); }
.ab[data-device="pc"] .bn-err { background: var(--danger-weak); color: var(--danger-ink); }
.ab[data-device="pc"] .bn-ok { background: var(--success-weak); color: var(--success-ink); }
.ab[data-device="pc"] .bn-gray { background: var(--surface); color: var(--fg-2); }

/* ── 10. 对话框 [7.1]：宽 480/640/720/960（h.modal 的 size），高 220–640，头 56，圆角 8 ── */
.ab[data-device="pc"] .ov:not(.ov-r) { background: var(--mask-bg); }
.ab[data-device="pc"] .dlg {
  width: var(--dialog-w-s);
  max-width: calc(100% - 32px);
  min-height: var(--dialog-h-min);
  max-height: var(--dialog-h-max);
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--dialog-radius);
  background: var(--bg);
  box-shadow: var(--shadow-lg);
}
.ab[data-device="pc"] .dlg h3 {
  flex: none;
  height: var(--dialog-head-h);
  margin: 0;
  padding: 0 24px;
  line-height: var(--dialog-head-h);
  color: var(--fg);
  font-size: var(--text-lg);
  font-weight: var(--fw-medium);
}
.ab[data-device="pc"] .dlg-b {
  flex: 1 1 auto;
  min-height: var(--dialog-body-min-h);
  overflow: auto;
  padding: 16px 24px;
  color: var(--fg-2);
  font-size: var(--text-sm);
  line-height: var(--lh-sm);
}
.ab[data-device="pc"] .dlg-a { flex: none; margin: 0; padding: 16px 24px; gap: 8px; justify-content: flex-end; }

/* ── 11. 缺省页 [6.3]：图形、标题、副标题、引导按钮（h.empty 生成） ───── */
.ab[data-device="pc"] .emp { padding: 48px 16px; color: var(--fg-3-ink); }
.ab[data-device="pc"] .emp-ic { margin-bottom: 16px; line-height: 0; color: var(--muted); }
.ab[data-device="pc"] .emp-t { font-size: var(--text-base); line-height: var(--lh-base); font-weight: var(--fw-medium); color: var(--fg); }
.ab[data-device="pc"] .emp-d { margin: 4px 0 0; font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--fg-3-ink); }

/* ── 12. 外层导航 [3.2]：一级 64 ───────────────────────────────────── */
.ab[data-device="pc"] .hdr { height: var(--nav-primary); }

/* ── 13. 通用：Toast ──────────────────────────────────────────────── */
.ab[data-device="pc"] .toast { border-radius: var(--radius-sm); background: var(--fg); }

</style>

<script>
/* 组件内置行为：表单必填与长度校验、提交（校验、加载、防重复、失败重试、成功后更新演示数据）、列表搜索筛选。
   页面用 h.form / h.fld({req, min, max}) / h.submit / h.search({filter}) / h.rows 声明，行为由这里统一实现。
   这些行为会被收集成规则，写进需求文档（W.audit.behave → 功能点「规则」）。 */
(function () {
  'use strict';
  var W = window.W;
  var h = W.h;
  var SUBMIT_MS = 600;            /* 演示用的提交耗时，用来展示加载态 */
  var FAIL_KEY = 'submitFail';    /* 演示数据顶层的开关（W.get 的路径）。为 true 时表单首次提交失败，见 acts 里的说明 */

  /* CSS 选择器里的属性值要转义，避免 id 中的引号或空格破坏选择器 */
  function attrVal(v) {
    return (window.CSS && CSS.escape) ? CSS.escape(String(v)) : String(v).replace(/["\\]/g, '\\$&');
  }

  /* ---------- 组件 ---------- */

  /* 表单容器：h.form(html, { id: 'leave', fn: 'form' })。id 在页面内唯一，提交按钮用它找到字段 */
  h.form = function (html, o) {
    o = o || {};
    return '<div class="wb-form"' + h.attrs({ fn: o.fn }) + ' data-form="' + h.esc(o.id || 'form') + '">' + html + '</div>';
  };

  /* 提交按钮：h.submit('提交申请', { form: 'leave', fn: 'submit', ok: { go: 'M01', st: 'list' }, append: 'list.items', appendName: '请假列表', appendDefaults: { no: '新申请', type: '事假' } })
     校验不通过不发请求；成功后 append 指向的演示数据新增一条（表单值，再加上 appendDefaults 补的表单外字段），并跳转到 ok；失败保留内容，可重试。 */
  h.submit = function (label, o) {
    o = o || {};
    var a = ' data-form="' + h.esc(o.form || 'form') + '"';
    if (o.ok && o.ok.go) a += ' data-ok-go="' + h.esc(o.ok.go) + '" data-ok-st="' + h.esc(o.ok.st || '') + '"';
    if (o.append) a += ' data-append="' + h.esc(o.append) + '" data-append-name="' + h.esc(o.appendName || o.append) + '"';
    if (o.appendDefaults) a += ' data-append-defaults="' + h.esc(JSON.stringify(o.appendDefaults)) + '"';
    return h.btn(label, { k: o.k || 'pri', cls: o.cls, fn: o.fn, act: 'form-submit', submit: true, attr: a.replace(/^ /, '') });
  };

  /* 可筛选列表：h.rows('list', [rowHtml, ...], { fn, empty })。搜索框用 h.search(ph, { filter: 'list' }) 与之配对。
     items 为空时直接返回 empty（由页面给出空状态）。 */
  h.rows = function (id, items, o) {
    o = o || {};
    if (!items || !items.length) return o.empty || '';
    return '<div data-fscope="' + h.esc(id) + '"' + h.attrs({ fn: o.fn }) + '>' +
      items.map(function (x) { return '<div data-frow>' + x + '</div>'; }).join('') +
      '<div data-fnomatch style="display:none">' + h.empty('没有匹配的结果', o.nomatch || '换个关键词试试') + '</div></div>';
  };

  /* ---------- 校验 ---------- */

  function fldName(fld) {
    var l = fld.querySelector('.lbl');
    return ((l ? l.textContent : '') || '').replace(/\*/g, '').trim() || '该字段';
  }
  function fldValue(fld) {
    var c = fld.querySelector('input,textarea,select');
    if (c) return String(c.value || '').trim();
    return Array.prototype.map.call(fld.querySelectorAll('.opt.on,.pill.on'), function (t) { return t.textContent.trim(); }).join('、');
  }
  function fldKey(fld) {
    var k = fld.getAttribute('data-field');
    if (k) return k;
    var c = fld.querySelector('[data-field]');
    return c ? c.getAttribute('data-field') : '';
  }
  /* 返回本字段的错误文字，没有错误返回空串 */
  function checkFld(fld) {
    var v = fldValue(fld), min = fld.getAttribute('data-min'), max = fld.getAttribute('data-max');
    if (fld.hasAttribute('data-req') && !v) return '请填写' + fldName(fld);
    if (v && min != null && v.length < +min) return fldName(fld) + '至少 ' + min + ' 个字';
    if (v && max != null && v.length > +max) return fldName(fld) + '最多 ' + max + ' 个字';
    return '';
  }
  function setErr(fld, msg) {
    var e = fld.querySelector('.ferr[data-auto]');
    if (!msg) {
      if (e) {
        e.parentNode.removeChild(e);
        fld.querySelectorAll('.inp').forEach(function (c) { c.classList.remove('bad'); });
      }
      return;
    }
    if (!e) {
      e = document.createElement('div');
      e.className = 'ferr';
      e.setAttribute('data-auto', '1');
      fld.appendChild(e);
    }
    e.textContent = msg;
    fld.querySelectorAll('.inp').forEach(function (c) { c.classList.add('bad'); });
  }
  function showFormErr(form, text) {
    var old = form.querySelector('.wb-form-err');
    if (old) old.parentNode.removeChild(old);
    if (!text) return;
    form.insertAdjacentHTML('afterbegin', h.bn('err', h.esc(text), { cls: 'wb-form-err' }));
  }
  /* 校验整个表单，返回是否通过；不通过时在字段下方提示并聚焦第一个错误 */
  function validate(form) {
    var first = null, n = 0;
    Array.prototype.forEach.call(form.querySelectorAll('.fld[data-req],.fld[data-min],.fld[data-max]'), function (fld) {
      var msg = checkFld(fld);
      setErr(fld, msg);
      if (msg) { n++; if (!first) first = fld; }
    });
    showFormErr(form, n ? '有 ' + n + ' 项需要修改，请按提示更正后再提交' : '');
    if (first) {
      var c = first.querySelector('input,textarea,select');
      if (c && c.focus) c.focus();
    }
    return !first;
  }
  /* 提交成功时把表单值整理成一行数据；表单没有的字段用 defaults 补上，表单值优先 */
  function collect(form, defaults) {
    var row = {};
    Object.keys(defaults || {}).forEach(function (k) { row[k] = defaults[k]; });
    Array.prototype.forEach.call(form.querySelectorAll('.fld'), function (fld) {
      var k = fldKey(fld);
      if (k) row[k] = fldValue(fld);
    });
    row.id = 'new-' + Date.now();
    return row;
  }

  /* ---------- 提交 ---------- */

  W.acts = W.acts || {};
  W.acts['form-submit'] = function (el, x) {
    if (el.dataset.busy) return;             /* 提交中：忽略重复点击 */
    var form = document.querySelector('.wb-form[data-form="' + attrVal(el.getAttribute('data-form')) + '"]');
    if (!form) { if (x.toast) x.toast('演示：找不到表单「' + el.getAttribute('data-form') + '」'); return; }
    if (!validate(form)) return;
    el.dataset.busy = '1';
    el.disabled = true;
    var orig = el.innerHTML;
    el.innerHTML = '提交中…';
    setTimeout(function () {
      if (!el.isConnected) return;           /* 页面已切换 */
      el.dataset.busy = '';
      el.disabled = false;
      el.innerHTML = orig;
      /* 失败演示：开关为 true 时，同一次渲染出来的表单，第一次提交失败；保留内容，再点即成功。
         切换数据场景或重新进入页面会重新渲染表单，计数随之重置。 */
      if (W.get(FAIL_KEY) && !form.dataset.failedOnce) {
        form.dataset.failedOnce = '1';
        showFormErr(form, '提交失败，网络异常。已填写的内容已保留，请重试。');
        return;
      }
      showFormErr(form, '');
      var path = el.getAttribute('data-append');
      if (path) {
        var defs = {};
        try { defs = JSON.parse(el.getAttribute('data-append-defaults') || '{}'); } catch (e) { defs = {}; }
        var set = {};
        set[path] = [collect(form, defs)].concat(W.get(path) || []);
        W.applySet(set);
      }
      if (el.getAttribute('data-ok-go')) x.nav(el.getAttribute('data-ok-go'), el.getAttribute('data-ok-st') || '');
      else x.render();
    }, SUBMIT_MS);
  };

  /* ---------- 筛选与清除错误（事件委托） ---------- */

  function applyFilter(id, q) {
    var scope = document.querySelector('[data-fscope="' + attrVal(id) + '"]');
    if (!scope) return;
    q = String(q || '').trim().toLowerCase();
    var rows = scope.querySelectorAll('[data-frow]'), hit = 0;
    Array.prototype.forEach.call(rows, function (r) {
      var ok = !q || r.textContent.toLowerCase().indexOf(q) >= 0;
      r.style.display = ok ? '' : 'none';
      if (ok) hit++;
    });
    var nm = scope.querySelector('[data-fnomatch]');
    if (nm) nm.style.display = hit === 0 && rows.length ? '' : 'none';
  }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-filter')) applyFilter(t.getAttribute('data-filter'), t.value);
    var fld = t.closest && t.closest('.fld');
    if (fld && fld.querySelector('.ferr[data-auto]')) setErr(fld, checkFld(fld));
  });

  /* ---------- 规则收集（供审计写入需求文档） ---------- */

  /* 扫描渲染结果，返回 [{ fn, text }]。文字是对组件行为的说明，不需要功能点另外写。 */
  W.behaveCollect = function (scope) {
    var out = [];
    function owner(el) { var o = el.closest('[data-fn]'); return o ? o.getAttribute('data-fn') : null; }
    function add(el, text) { var fn = owner(el); if (fn) out.push({ fn: fn, text: text }); }
    /* 必填与长度只对 .wb-form 里、且有 h.submit 配对的表单生成规则。没有提交按钮的 h.fld 只是摆放，不做组件级校验。 */
    var paired = {};
    Array.prototype.forEach.call(scope.querySelectorAll('[data-act="form-submit"]'), function (el) { paired[el.getAttribute('data-form')] = true; });
    Array.prototype.forEach.call(scope.querySelectorAll('.wb-form'), function (form) {
      if (!paired[form.getAttribute('data-form')]) return;
      Array.prototype.forEach.call(form.querySelectorAll('.fld[data-req],.fld[data-min],.fld[data-max]'), function (fld) {
        var n = fldName(fld), min = fld.getAttribute('data-min'), max = fld.getAttribute('data-max');
        if (fld.hasAttribute('data-req')) add(fld, n + '为必填项，为空时不能提交');
        if (min != null && max != null) add(fld, n + '长度为 ' + min + '–' + max + ' 个字，不在此范围内时不能提交');
        else if (min != null) add(fld, n + '至少 ' + min + ' 个字，不足时不能提交');
        else if (max != null) add(fld, n + '最多 ' + max + ' 个字，超出时不能提交');
      });
    });
    /* 演示数据里有没有能让提交失败的场景，决定规则里要不要提“可切换” */
    var canFail = W.presets().some(function (p) {
      var s = JSON.stringify(p.set || '');
      return s.indexOf(FAIL_KEY) >= 0 && s.indexOf('true') >= 0;
    });
    Array.prototype.forEach.call(scope.querySelectorAll('[data-act="form-submit"]'), function (el) {
      add(el, '提交前先校验必填项和长度，不通过时在字段下方提示，不发出请求');
      add(el, '提交中按钮禁用，重复点击只提交一次');
      add(el, '提交失败时保留已填内容并提示，可直接重试' + (canFail ? '（可在数据场景中切换，演示首次提交失败）' : ''));
      var go = el.getAttribute('data-ok-go');
      var acts = [];
      if (el.getAttribute('data-append')) acts.push('在「' + el.getAttribute('data-append-name') + '」中新增一条');
      if (go && W.pages[go]) acts.push('进入「' + W.pages[go].title + '」');
      add(el, acts.length ? '提交成功后' + acts.join('，') : '提交成功后刷新当前页面');
    });
    Array.prototype.forEach.call(scope.querySelectorAll('[data-filter]'), function (el) {
      add(el, '列表内容随输入实时筛选（匹配列表行中的文字），无匹配项时显示“没有匹配的结果”');
    });
    return out;
  };

  /* 把审计得到的规则挂到功能点的 auto 上，需求文档和摘要读取 f.auto */
  W.behaveApply = function (audit) {
    if (!audit || !audit.behave) return;
    Object.keys(audit.behave).forEach(function (pid) {
      var p = W.pages[pid];
      if (!p) return;
      (p.fns || []).forEach(function (f) { f.auto = audit.behave[pid][f.id] || []; });
    });
  };
})();

</script>
<script>
/* Markdown 渲染：Marked 解析 + DOMPurify 白名单 + 可选 Mermaid。所有需求文字都经过这里。 */
(function () {
  'use strict';
  var W = window.W;
  var SAFE_URI = /^(?:(?:https?|mailto|tel):|data:image\/(?:png|gif|jpe?g|webp);base64,|#|[^:]*$)/i;
  var OPT = {
    FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed', 'form', 'link', 'meta', 'base', 'input', 'button', 'textarea', 'select'],
    FORBID_ATTR: ['style', 'srcset'],
    ALLOWED_URI_REGEXP: SAFE_URI
  };
  var BADGE = [
    [/\[待确认\]/g, '<span class="bdg pending">待确认</span>'],
    [/\[(?:AI\s*假设|AI)\]/g, '<span class="bdg assumed">AI 假设</span>']
  ];
  function badges(s) {
    BADGE.forEach(function (b) { s = s.replace(b[0], b[1]); });
    return s;
  }
  var hooked = false;
  function clean(html) {
    if (!window.DOMPurify) return String(html).replace(/[<>]/g, '');
    if (!hooked) {
      /* 交付文件必须离线可用：图片只接受内嵌的 data URI */
      window.DOMPurify.addHook('afterSanitizeAttributes', function (node) {
        if (node.tagName === 'IMG' && !/^data:image\//i.test(node.getAttribute('src') || '')) {
          node.removeAttribute('src');
          node.setAttribute('alt', '（图片未内嵌，已忽略）');
        }
      });
      hooked = true;
    }
    return window.DOMPurify.sanitize(html, OPT);
  }
  function parse(s, inline) {
    s = badges(String(s == null ? '' : s));
    if (!window.marked) return W.h.esc(s);
    return inline ? window.marked.parseInline(s, { gfm: true, breaks: true }) : window.marked.parse(s, { gfm: true, breaks: true });
  }
  var mid = 0, inited = false;
  function mermaidIn(root) {
    var blocks = root.querySelectorAll('pre > code.language-mermaid');
    if (!blocks.length) return;
    if (!window.mermaid) {
      blocks.forEach(function (c) { c.parentNode.insertAdjacentHTML('beforebegin', '<p class="doc-empty">（流程图需要 Mermaid，构建时未内嵌）</p>'); });
      return;
    }
    if (!inited) {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral', fontFamily: 'inherit' });
      inited = true;
    }
    blocks.forEach(function (c) {
      var pre = c.parentNode, code = c.textContent, id = 'mmd-' + (++mid);
      var box = document.createElement('div');
      box.className = 'mermaid';
      pre.replaceWith(box);
      window.mermaid.render(id, code).then(function (r) {
        box.innerHTML = window.DOMPurify ? window.DOMPurify.sanitize(r.svg, { USE_PROFILES: { svg: true, svgFilters: true }, FORBID_TAGS: ['script', 'foreignObject'] }) : '';
      }).catch(function (e) {
        box.innerHTML = '<p class="doc-empty">流程图语法错误：' + W.h.esc(e && e.message || e) + '</p>';
      });
    });
  }
  W.md = {
    inline: function (s) { return clean(parse(s, true)); },
    block: function (s) { return clean(parse(s, false)); },
    into: function (el, s) {
      el.innerHTML = clean(parse(s, false));
      el.querySelectorAll('a[href]').forEach(function (a) {
        if (/^https?:/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      });
      mermaidIn(el);
    },
    clean: clean,
    /* 纯文本（用于 Markdown 导出时去掉徽标 HTML） */
    plainBadges: function (s) {
      return String(s == null ? '' : s).replace(/\[待确认\]/g, '【待确认】').replace(/\[(?:AI\s*假设|AI)\]/g, '【AI 假设】');
    }
  };
})();

<script>
/* 需求文档模型：全文需求（文档栏目与 Markdown 导出同源）、功能点卡片、统计与待确认清单。 */
(function () {
  'use strict';
  var W = window.W, h = W.h;
  var D = (W.doc = {});
  var CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  var TYPE_CN = { added: '新增', modified: '修改', removed: '移除' };
  var TYPE_CLS = { added: 'add', modified: 'mod', removed: 'del' };

  /* ---------- 基础判断 ---------- */
  D.cur = function () { return W.P.current || (W.P.releases && W.P.releases.length ? W.P.releases[W.P.releases.length - 1].id : W.P.version || 'V1.0'); };
  D.multiRelease = function () { return (W.P.releases || []).length > 1; };
  D.status = function (x) {
    if (x == null) return 'confirmed';
    if (typeof x === 'string') {
      if (/\[待确认\]/.test(x)) return 'pending';
      if (/\[(?:AI\s*假设|AI)\]/.test(x)) return 'assumed';
      return 'confirmed';
    }
    var s = x.status;
    if (s === 'pending') return 'pending';
    if (s === 'assumed' || s === 'ai' || s === 'ai-draft') return 'assumed';
    var t = x.text || x.desc || x.rule || '';
    if (/\[待确认\]/.test(t)) return 'pending';
    if (/\[(?:AI\s*假设|AI)\]/.test(t)) return 'assumed';
    return 'confirmed';
  };
  D.items = function (list) {
    return (list || []).map(function (x) { return typeof x === 'string' ? { text: x } : x; });
  };
  D.chg = function (x, ver) {
    ver = ver || D.cur();
    return x && x.changes ? x.changes.find(function (c) { return c.ver === ver; }) || null : null;
  };
  /* 新增页面里的功能点自动视为本版新增（不进变更明细，避免重复） */
  D.inheritChanges = function () {
    Object.keys(W.pages).forEach(function (id) {
      var p = W.pages[id];
      (p.changes || []).forEach(function (c) {
        if (c.type !== 'added') return;
        (p.fns || []).forEach(function (f) {
          f.changes = f.changes || [];
          if (!f.changes.some(function (x) { return x.ver === c.ver; })) f.changes.push({ ver: c.ver, type: 'added', inherited: true });
        });
      });
    });
  };
  D.removed = function (x) { return !!(x && x.changes && x.changes.some(function (c) { return c.type === 'removed'; })); };
  D.pageChanged = function (p, ver) {
    if (D.chg(p, ver)) return true;
    if ((p.fns || []).some(function (f) { return D.chg(f, ver) || (f.fields || []).some(function (x) { return D.chg(x, ver); }); })) return true;
    return D.items(p.rules).some(function (r) { return D.chg(r, ver); });
  };
  D.localTime = function (iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || '');
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  };
  D.num = function (i) { return i < 20 ? CIRCLED[i] : '(' + (i + 1) + ')'; };
  D.fnIndex = function (p, id) { return (p.fns || []).findIndex(function (f) { return f.id === id; }); };
  D.letter = function (i) { return String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : ''); };
  D.stateLabel = function (p, sid) {
    var s = (p.states || []).find(function (x) { return x.id === sid; });
    return s ? s.label : sid;
  };

  /* 功能点出现在哪些状态：优先读构建检查结果；原生页面可现场计算 */
  var stateCache = {};
  D.fnStates = function (p) {
    if (W.audit && W.audit.fnStates && W.audit.fnStates[p.id]) return W.audit.fnStates[p.id];
    if (stateCache[p.id]) return stateCache[p.id];
    if (typeof p.render !== 'function') return null;
    var out = {};
    var saved = JSON.stringify(W.store);
    var sets = [null].concat(W.presets().map(function (x) { return x.id; }));
    W.device = ((W.end(p.end) || {}).device === 'mobile') ? 'mobile' : 'pc';
    (p.states.length ? p.states : [{ id: '' }]).forEach(function (s) {
      sets.forEach(function (ps) {
        try {
          if (ps) W.applySet('preset=' + ps);
          var html = p.render({ st: s.id, s: W.store, p: p });
          var re = /data-fn="([^"]+)"/g, m;
          while ((m = re.exec(html))) {
            out[m[1]] = out[m[1]] || [];
            if (out[m[1]].indexOf(s.id) < 0) out[m[1]].push(s.id);
          }
        } catch (e) {}
        W.store = JSON.parse(saved);
      });
    });
    stateCache[p.id] = out;
    return out;
  };

  /* ---------- 片段渲染（HTML 与 Markdown 共用的取数逻辑） ---------- */
  /* 文字里已经写了 [待确认] / [AI 假设] 时不再重复加徽标 */
  function ownStatus(x) {
    if (!x || typeof x !== 'object') return 'confirmed';
    var t = String(x.text || x.rule || x.desc || '');
    if (/\[待确认\]|\[(?:AI\s*假设|AI)\]/.test(t) && !/^(?:pending|assumed|ai|ai-draft)$/.test(x.status || '')) return 'confirmed';
    var st = D.status(x);
    if (st === 'pending' && /\[待确认\]/.test(t)) return 'confirmed';
    if (st === 'assumed' && /\[(?:AI\s*假设|AI)\]/.test(t)) return 'confirmed';
    return st;
  }
  function badgeHTML(x, ver) {
    var s = '';
    var st = ownStatus(x);
    if (st === 'pending') s += '<span class="bdg pending">待确认</span>';
    if (st === 'assumed') s += '<span class="bdg assumed">AI 假设</span>';
    if (x && x.changes) x.changes.forEach(function (c) {
      if (!ver || c.ver === ver) s += '<span class="bdg ' + TYPE_CLS[c.type] + '">' + h.esc(c.ver) + ' ' + TYPE_CN[c.type] + '</span>';
    });
    return s;
  }
  function badgeText(x, ver) {
    var s = '';
    var st = ownStatus(x);
    if (st === 'pending') s += '【待确认】';
    if (st === 'assumed') s += '【AI 假设】';
    if (x && x.changes) x.changes.forEach(function (c) { if (!ver || c.ver === ver) s += '【' + c.ver + ' ' + TYPE_CN[c.type] + '】'; });
    return s;
  }
  D.badgeHTML = badgeHTML;
  D.badgeText = badgeText;

  /* 功能点卡片正文（右侧面板用） */
  D.fnBodyHTML = function (f, p, o) {
    o = o || {};
    var md = W.md, s = '';
    var c = o.ver === '__none__' ? null : D.chg(f);
    if (c && c.note) s += '<p><span class="bdg ' + TYPE_CLS[c.type] + '">本版' + TYPE_CN[c.type] + '</span>' + md.inline(c.note) + '</p>';
    if (f.gap) s += '<p><span class="bdg del">原型未体现</span>' + md.inline(f.gap) + '</p>';
    if (f.desc) s += '<div>' + md.block(f.desc) + '</div>';
    var fields = (f.fields || []).filter(function (x) { return o.showRemoved || !D.removed(x); });
    if (fields.length) {
      s += '<div class="k">字段</div>' + fields.map(function (x) {
        return '<div class="fd"><b>' + md.inline(x.name || x.key) + '</b>' + (x.key && x.name ? ' <code>' + h.esc(x.key) + '</code>' : '') + '<span class="ty">' + h.esc(x.type || '') + '</span>' + (x.required ? '<span class="rq">必填</span>' : '') + badgeHTML(x, o.ver) +
          (x.def != null && x.def !== '' ? '<div>默认：' + md.inline(String(x.def)) + '</div>' : '') +
          (x.options ? '<div>可选值：' + md.inline(Array.isArray(x.options) ? x.options.join('、') : x.options) + '</div>' : '') +
          (x.rule ? '<div>' + md.inline(x.rule) + '</div>' : '') + '</div>';
      }).join('');
    }
    function list(title, arr) {
      var it = D.items(arr).filter(function (x) { return o.showRemoved || !D.removed(x); });
      if (!it.length) return '';
      return '<div class="k">' + title + '</div><ul>' + it.map(function (x) { return '<li>' + md.inline(x.text) + badgeHTML(x, o.ver) + '</li>'; }).join('') + '</ul>';
    }
    s += list('规则', D.items(f.rules).concat(D.items(f.auto)));
    s += list('异常与边界', f.errors);
    if (f.empty) s += '<div class="k">空数据</div><div>' + md.inline(f.empty) + '</div>';
    if (f.perm) s += '<div class="k">权限</div><div>' + md.inline(f.perm) + '</div>';
    if (f.src) s += '<div class="src">来源：' + md.inline(Array.isArray(f.src) ? f.src.join('；') : f.src) + '</div>';
    if (o.states && o.states.length && p) {
      s += '<div class="vis">出现在：' + o.states.map(function (sid) {
        return '<a class="chip sm" data-nav="' + h.esc(p.id + '|' + sid) + '" data-fnsel="' + h.esc(f.id) + '">' + h.esc(D.stateLabel(p, sid) || '默认') + '</a>';
      }).join('') + '</div>';
    }
    return s;
  };

  /* ---------- Markdown 生成 ---------- */
  function cell(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>'); }
  function table(head, rows) {
    if (!rows.length) return '';
    return '| ' + head.join(' | ') + ' |\n|' + head.map(function () { return ' --- '; }).join('|') + '|\n' + rows.map(function (r) { return '| ' + r.map(cell).join(' | ') + ' |'; }).join('\n') + '\n\n';
  }
  function joinSrc(src) { return Array.isArray(src) ? src.join('；') : src; }

  /* opts: { html: true 文档栏目 / false 导出, changesOnly: 只看本版变化 } */
  D.markdown = function (opts) {
    opts = opts || {};
    var HTML = !!opts.html, only = !!opts.changesOnly, ver = D.cur(), P = W.P;
    var out = [], ch = 0, toc = [];
    function T(s) { return HTML ? s : W.md.plainBadges(s); }
    function B(x, v) { return HTML ? badgeHTML(x, v) : badgeText(x, v); }
    function anchor(id) { return HTML ? '<a id="' + id + '"></a>\n\n' : ''; }
    function link(text, href) { return HTML ? '[' + text + '](' + href + ')' : ''; }
    function chapter(title) {
      ch++;
      var id = 'd-ch-' + ch;
      toc.push({ id: id, title: ch + ' ' + title, level: 1 });
      out.push(anchor(id) + '## ' + ch + ' ' + title + '\n\n');
      return ch;
    }

    function bullets(arr) {

    if (R.ignored) Wn('IGNORED', '有 ' + R.ignored + ' 个原型元素按 end.ignore 标为不纳入本次需求，未计入覆盖率');
    return finish(R);
  };

  /* 范围基线：页面、状态、功能点（含公共组件功能点）的清单。key 稳定，用于和 prd/scope.json 对比 */
  W.scopeInventory = function () {
    var P = W.P, out = { pages: [], states: [], fns: [] };
    if (!P || !W.order) return out;
    (P.ends || []).forEach(function (e) {
      (W.order[e.id] || []).forEach(function (id) {
        var p = W.pages[id];
        if (!p) return;
        var pl = (p.title || '');
        out.pages.push({ k: p.id, l: p.id + ' ' + pl });
        (p.states || []).forEach(function (s) { out.states.push({ k: p.id + '/' + s.id, l: p.id + ' ' + pl + ' · 状态「' + (s.label || s.id) + '」' }); });
        (p.fns || []).forEach(function (f) { out.fns.push({ k: p.id + '/' + f.id, l: p.id + ' ' + pl + ' · 功能点「' + (f.name || f.id) + '」' }); });
      });
    });
    W.sharedGroups.forEach(function (g) {
      (g.fns || []).forEach(function (f) { out.fns.push({ k: '公共/' + (g.id || '') + '/' + f.id, l: '公共组件「' + (g.title || g.id) + '」 · 功能点「' + (f.name || f.id) + '」' }); });
    });
    return out;
  };
  /* 读取构建时嵌入的基线（prd/scope.json），没有则返回 null */
  W.scopeBaseline = function () {
    var el = document.getElementById('prd-scope');
    try { var t = el && el.textContent.trim(); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  };
  /* 当前清单与基线对比：返回 null 表示没有基线。新增和移除都只提醒，不阻止交付 */
  W.scopeDiff = function () {
    var base = W.scopeBaseline();
    if (!base) return null;
    var inv = W.scopeInventory(), added = [], removed = [];
    var kinds = { pages: '页面', states: '状态', fns: '功能点' };
    ['pages', 'states', 'fns'].forEach(function (kind) {
      var have = base[kind] || [];
      var cur = inv[kind];
      var curKeys = cur.map(function (x) { return x.k; });
      cur.forEach(function (x) { if (have.indexOf(x.k) < 0) added.push({ kind: kinds[kind], key: x.k, label: x.l }); });
      have.forEach(function (k) { if (curKeys.indexOf(k) < 0) removed.push({ kind: kinds[kind], key: k }); });
    });
    return { release: base.release || '', confirmedAt: base.confirmedAt || '', added: added, removed: removed };
  };

  function finish(R) {
    var st = D.stats();
    W.behaveApply({ behave: R.behave });
    var isProto = !!(W.P && W.P.stage === 'prototype');
    return Object.assign({
      behave: R.behave,
      ok: R.errors.length === 0,
      at: new Date().toISOString(),
      release: st.release,
      errors: R.errors,
      warns: R.warns,
      stats: Object.assign(st, { interactive: R.interactive, covered: R.covered, ignored: R.ignored || 0, renders: R.renders, errors: R.errors.length, warns: R.warns.length }),
      fnStates: R.fnStates,
      links: R.links,
      inventory: W.scopeInventory(),
      scope: W.scopeDiff()
    }, isProto ? { stage: 'prototype' } : {});
  }
})();

</script>

<script>
/* theme-kit.js */
/* gaodeng-pc 组件扩展。new.mjs --theme gaodeng-pc 会把本文件复制为 prd/theme-kit.js。
   在 core.js 之后加载，覆盖 h.modal、h.empty、h.table，并新增 h.pager。
   只作用于 PC 画板：运行时把当前端写入 W.device（'pc' 或 'mobile'），手机端一律调用原来的组件实现，输出与不带规范包时一致。
   页面调用方式不变；不选用规范包时不加载，线框组件保持原样。 */
(function () {
  'use strict';
  var W = window.W;
  var h = W.h;
  var base = { modal: h.modal, table: h.table, empty: h.empty };
  var DLG_W = { s: 480, m: 640, l: 720, xl: 960 };
  var EMP_ICON = { blank: 'box', info: 'info', system: 'warn' };
  var PAGE_SIZE = 10;

  function onPc() { return W.device === 'pc'; }

  /* 对话框四档宽度 [7.1]：h.modal(标题, 正文, 按钮, { size: 's' | 'm' | 'l' | 'xl', fn })。
     也可以直接用 o.w 指定宽度（如 480）。PC 端不写 size 时为 480。 */
  h.modal = function (title, body, actions, o) {
    if (!onPc()) return base.modal(title, body, actions, o);
    o = Object.assign({}, o || {});
    if (o.size && !DLG_W[o.size]) W.errors.push('h.modal 的 size 只能是 s、m、l、xl（当前：' + o.size + '）');
    if (!o.w) o.w = DLG_W[o.size] || DLG_W.s;
    return base.modal(title, body, actions, o);
  };

  /* 缺省页 [6.3]：图形、标题、副标题、引导按钮。
     h.empty(标题, 副标题, 引导按钮 html, { kind: 'blank' | 'info' | 'system' })
     blank 空白（暂无数据、搜索无结果）；info 信息（内容已删除、无权限）；system 系统（加载失败、网络异常）。 */
  h.empty = function (title, desc, action, o) {
    if (!onPc()) return base.empty(title, desc, action);
    o = o || {};
    var kind = EMP_ICON[o.kind] ? o.kind : 'blank';
    return '<div class="emp" data-empty="' + kind + '"><div class="emp-ic">' + h.i(EMP_ICON[kind], 40) + '</div>' +
      '<div class="emp-t">' + title + '</div>' +
      (desc ? '<p class="emp-d">' + desc + '</p>' : '') +
      (action ? '<div class="mt16">' + action + '</div>' : '') + '</div>';
  };

  /* 整表没有数据时用缺省页代替表格 [6.3、6.5]。
     h.table(列名, 行, { fn, empty: 标题, emptyDesc, emptyAction, emptyKind }) */
  h.table = function (cols, rows, o) {
    if (!onPc()) return base.table(cols, rows, o);
    o = o || {};
    if (rows && rows.length) return base.table(cols, rows, o);
    return '<div data-list' + h.attrs({ fn: o.fn }) + '>' +
      h.empty(o.empty || '暂无数据', o.emptyDesc, o.emptyAction, { kind: o.emptyKind }) + '</div>';
  };

  /* 分页 [6.5]：默认每页 10 行，页码显示规则按规范原文。
     总行数不足 10 时隐藏页码，保留“共 N 条”；超过 10 行时显示页码和“第 X~Y 条 / 共 N 条”。
     是否连“共 N 条”一起隐藏，原文未明确，见 CONFLICTS C25（待确认）。
     h.pager(总行数, { page: 当前页, fn: 功能点 })
     翻页按钮只作展示，不可点击（AI 假设）；带输入操作的表格用滚动，不用分页。
     手机端没有分页组件，返回空串。 */
  h.pager = function (total, o) {
    if (!onPc()) return '';
    o = o || {};
    total = Math.max(0, Number(total) || 0);
    var attrs = h.attrs({ fn: o.fn });
    if (total < PAGE_SIZE) return '<div class="pager"' + attrs + '><span>共 ' + total + ' 条</span></div>';
    var pages = Math.ceil(total / PAGE_SIZE);
    var cur = Math.min(Math.max(Number(o.page) || 1, 1), pages);
    var from = (cur - 1) * PAGE_SIZE + 1;
    var to = Math.min(cur * PAGE_SIZE, total);
    var nums = '';
    for (var i = 1; i <= pages; i++) nums += '<span class="pg-n' + (i === cur ? ' on' : '') + '">' + i + '</span>';
    return '<div class="pager"' + attrs + '><span>第 ' + from + '~' + to + ' 条 / 共 ' + total + ' 条</span>' +
      '<span class="pg-b' + (cur === 1 ? ' dis' : '') + '">' + h.i('cl', 14) + '</span>' + nums +
      '<span class="pg-b' + (cur === pages ? ' dis' : '') + '">' + h.i('cr', 14) + '</span></div>';
  };
})();

</script>

<script>
/* 评审意见：评审者在功能点上留意见，存在本机浏览器（localStorage）里，可导出 JSON，再由 scripts/merge-comments.mjs 合并。
   target 格式：功能点 `页面ID/功能点ID`；公共组件 `S:端ID/功能点ID`；页面级 `页面ID`。 */
(function () {
  'use strict';
  var W = window.W;
  var C = (W.comments = {});
  var AUTHOR_KEY = 'prd-comments-author';

  function product() { return W.P || {}; }
  function storeKey() { return 'prd-comments:' + (product().id || product().name || ''); }
  function read() {
    try {
      var a = JSON.parse(localStorage.getItem(storeKey()) || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function write(list) { localStorage.setItem(storeKey(), JSON.stringify(list)); }
  function parseTarget(target) {
    var s = String(target || '');
    if (s.indexOf('S:') === 0) {
      var a = s.slice(2).split('/');
      return { pageId: null, fnId: a.slice(1).join('/') || null };
    }
    var i = s.indexOf('/');
    if (i < 0) return { pageId: s || null, fnId: null };
    return { pageId: s.slice(0, i), fnId: s.slice(i + 1) || null };
  }
  function localDate() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  C.author = function () {
    try { return localStorage.getItem(AUTHOR_KEY) || ''; } catch (e) { return ''; }
  };
  C.setAuthor = function (name) {
    localStorage.setItem(AUTHOR_KEY, String(name || '').trim());
  };

  C.list = function (target) {
    var all = read();
    if (target === undefined || target === null) return all;
    return all.filter(function (c) { return c.target === target; });
  };

  C.add = function (o) {
    o = o || {};
    var text = String(o.text == null ? '' : o.text).trim();
    if (!text) throw new Error('意见不能为空');
    var target = o.target || (o.pageId ? o.pageId + (o.fnId ? '/' + o.fnId : '') : '');
    var t = parseTarget(target);
    if (!t.pageId && !/^S:/.test(target)) throw new Error('意见缺少对象（target）');
    var item = {
      id: 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      target: target,
      pageId: t.pageId,
      fnId: t.fnId,
      text: text,
      author: o.author !== undefined ? String(o.author).trim() : C.author(),
      at: new Date().toISOString(),
      resolved: false
    };
    var list = read();
    list.push(item);
    write(list);
    return item;
  };

  /* 只允许改正文和是否已处理，其余字段（对象、时间、作者）保持不变 */
  C.update = function (id, patch) {
    var list = read(), item = null;
    list.some(function (c) { if (c.id === id) { item = c; return true; } return false; });
    if (!item) return null;
    patch = patch || {};
    if ('text' in patch) {
      var text = String(patch.text == null ? '' : patch.text).trim();
      if (!text) throw new Error('意见不能为空');
      item.text = text;
    }
    if ('resolved' in patch) item.resolved = !!patch.resolved;
    write(list);
    return item;
  };

  C.remove = function (id) {
    var list = read();
    var next = list.filter(function (c) { return c.id !== id; });
    if (next.length === list.length) return false;
    write(next);
    return true;
  };

  C.count = function (target) {
    var all = read();
    if (target === undefined || target === null) return all.length;
    return all.filter(function (c) { return c.target === target; }).length;
  };
  C.countByPage = function (pageId) {
    return read().filter(function (c) { return c.pageId === pageId; }).length;
  };

  C.exportJSON = function (author) {
    var p = product();
    var who = author !== undefined ? String(author).trim() : C.author();
    return {
      v: 1,
      productId: p.id || p.name || '',
      productName: p.name || '',
      release: W.doc && W.doc.cur ? W.doc.cur() : '',
      exportedAt: new Date().toISOString(),
      author: who,
      /* 条目作者空时用本次导出作者兜底，便于流程 C 写 src */
      comments: read().map(function (c) {
        var a = String(c.author || '').trim();
        if (a) return c;
        var copy = {};
        for (var k in c) if (Object.prototype.hasOwnProperty.call(c, k)) copy[k] = c[k];
        copy.author = who;
        return copy;
      })
    };
  };

  C.download = function (author) {
    var obj = C.exportJSON(author);
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json;charset=utf-8' });
    var name = (obj.productName || '原型') + '-评审意见-' + (obj.release || 'V1.0') + '-' + localDate() + '.json';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return name;
  };
})();

</script>
<script>
/* 原型需求浏览器：路由、画板缩放、热区、标注圆点、需求面板、需求文档、流程演示、托管原型。 */
(function () {
  'use strict';
  var W = window.W, h = W.h, D = W.doc, HOST = W.host;
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  var ui = { zoom: 'fit', last: {}, scale: 1, cur: null, sel: null, visible: {}, docKey: '', enterSeq: 0, hostEnd: null, unknown: false, proto: false, cmt: { scope: 'page', sel: null, page: null, draft: '', popDraft: '', pop: null }, role: 'all' };
  var PREF;
  function pref(k, v) {
    try {
      var o = JSON.parse(localStorage.getItem(PREF) || '{}');
      if (v === undefined) return o[k];
      o[k] = v;
      localStorage.setItem(PREF, JSON.stringify(o));
    } catch (e) { return undefined; }
  }

  /* 判断功能点是否属于角色 R：「全部角色」或未选时全可见；没有 roles / 空数组 / 含 R 时可见 */
  function fnVisibleForRole(fn, role) {
    if (!role || role === 'all') return true;
    if (!fn.roles || !fn.roles.length) return true;
    return fn.roles.indexOf(role) >= 0;
  }
  W.fnVisibleForRole = fnVisibleForRole;

  /* ---------- 启动整理 ---------- */
  function finalize() {
    var P = W.P;
    P.ends = P.ends || [];
    P.groups = P.groups || {};
    P.ends.forEach(function (e) {
      var ids = W.order[e.id] || [];
      var given = P.groups[e.id];
      var groups;
      if (given && given.length) {
        groups = given.map(function (g) { return [g[0], g[1].filter(function (id) { return W.pages[id]; })]; }).filter(function (g) { return g[1].length; });
      } else {
        groups = [];
        ids.forEach(function (id) {
          var gname = W.pages[id].group || '页面';
          var g = groups.find(function (x) { return x[0] === gname; });
          if (!g) groups.push(g = [gname, []]);
          g[1].push(id);
        });
      }
      var listed = {};
      groups.forEach(function (g) { g[1].forEach(function (id) { listed[id] = 1; }); });
      var rest = ids.filter(function (id) { return !listed[id]; });
      if (rest.length) groups.push(['其他', rest]);
      P.groups[e.id] = groups;
      ui.last[e.id] = e.home && W.pages[e.home] ? e.home : ids[0];
    });
    if (!P.releases || !P.releases.length) P.releases = [{ id: P.version || 'V1.0', date: P.date || '' }];
    D.inheritChanges();
    try { var a = document.getElementById('prd-audit'); W.audit = a && a.textContent.trim() ? JSON.parse(a.textContent) : null; } catch (e) { W.audit = null; }
    W.behaveApply(W.audit);
    PREF = 'prd-viewer:' + (P.id || P.name);
    /* 原型阶段：打开即原型，没有需求文档栏目、需求面板、需求按钮，圆点默认隐藏且不记住偏好 */
    ui.proto = P.stage === 'prototype';
    /* 初始化角色偏好：记住上次选择的角色，没有则默认"全部角色" */
    if (P.roles && P.roles.length) {
      ui.role = pref('role') || 'all';
      if (ui.role !== 'all' && !P.roles.some(function (r) { return r.id === ui.role; })) ui.role = 'all';
    }
  }
  function protoHome() { return ui.last[W.P.ends[0].id]; }

  /* ---------- 路由 ---------- */
  function parse() {
    var raw = location.hash.replace(/^#\/?/, '');
    var q = {}, qi = raw.indexOf('?');
    if (qi >= 0) {
      raw.slice(qi + 1).split('&').forEach(function (x) {
        if (!x) return;
        var kv = x.split('=');
        q[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
      raw = raw.slice(0, qi);
    }

    var p = W.pages[a];

  /* 当前要挂的对象：圆点选中的功能点；没有选中时挂到本页 */

    var wrap = $('#devwrap'), stage = $('#stage'), scr = $('#scr');
    var availW = stage.clientWidth - 48;
    var flowH = document.body.classList.contains('flow-on') ? 84 : 0;
    var availH = stage.clientHeight - 40 - 44 - flowH;
    var s, hosted = !!$('#hostf');
    var sz = hosted ? HOST.size(e) : { w: e.width || (e.device === 'mobile' ? 375 : 1280), h: e.height || (e.device === 'mobile' ? 812 : 800) };
    if (dev.classList.contains('dev-m')) {
      var DW = sz.w + 22, DH = sz.h + 22;
      s = ui.zoom === 'fit' ? Math.min(1, availW / DW, availH / DH) : 1;

      dev.style.transform = 'scale(' + s + ')';

      wrap.style.height = DH * s + 'px';
    } else {
      var PW = sz.w + 2;

  document.addEventListener('click', function (e) {

    if (fdot) { cmtFollow(fdot.dataset.fdot); selectFn(fdot.dataset.fdot, true); return; }
    var fch = t.closest('[data-fc]');

      var fb = $('#flowbar'), fid = fb.dataset.f, i = +fb.dataset.i, k = fbb.dataset.fb;

      if (k2 === 'chg') { B.toggle('chg-on'); pref('chg', B.contains('chg-on')); ui.docKey = ''; render({ keepSel: true }); }
      if (k2 === 'zoom') { ui.zoom = ui.zoom === 'fit' ? '100' : 'fit'; fit(); }
      if (k2 === 'left') { if (innerWidth <= 1100) { B.toggle('m-l'); B.remove('m-r'); } else B.toggle('no-l'); setTimeout(fit, 220); }
      if (k2 === 'right') { if (innerWidth <= 1100) { B.toggle('m-r'); B.remove('m-l'); } else B.toggle('no-r'); setTimeout(fit, 220); }
      if (k2 === 'reset') {
        W.reset();
        W.P.ends.forEach(function (en) { (en.resetKeys || []).forEach(function (pre) { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(pre) === 0) localStorage.removeItem(k); }); } catch (x) {} }); });
        ui.hostEnd = null;

      $$('.menu.open').forEach(function (m) { m.classList.remove('open'); });

    }
    $$('.menu.open', ab).forEach(function (m) { if (!m.contains(t)) m.classList.remove('open'); });
